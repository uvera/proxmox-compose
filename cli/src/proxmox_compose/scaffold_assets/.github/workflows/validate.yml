# Proxmox Compose scaffolded workspace — validate Ansible at repo root.
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  iac-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ansible syntax check (provision-infra)
        run: |
          pip install ansible-core
          cd config/ansible
          ansible-playbook -i inventory/static.yml playbooks/provision-infra.yml --syntax-check
      - name: Ansible syntax check (post-provision)
        run: |
          cd config/ansible
          ansible-playbook -i inventory/static.yml playbooks/post-provision.yml --syntax-check
