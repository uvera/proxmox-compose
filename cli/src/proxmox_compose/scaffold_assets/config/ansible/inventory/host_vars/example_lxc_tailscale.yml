# Example: Debian LXC with Docker Compose + Tailscale Serve/Funnel (group debian_lxcs).
# Rename to match your inventory hostname.
#
# Prerequisites:
# - MagicDNS, HTTPS for your tailnet, and Funnel nodeAttrs policy (see docs/tailscale-on-lxc.md).
# - For unprivileged LXC: kernel TUN on the Proxmox host (same doc), or set tailscale_userspace: true.
#   For deployment-integrated host-side config, set:
#   lxc_host_config_enable: true
#   lxc_tun_enable: true
#   lxc_apparmor_unconfined_enable: true
#   lxc_host_config_restart: true
#   lxc_host_config_vmid: 210
#   lxc_host_config_node_name: pve
#   lxc_host_config_node_addresses: { pve: 10.0.0.2 }
# - Add tailscale_authkey to encrypted vault.yml (see group_vars/all/vault.example.yml).

tailscale_enable: true
# tailscale_userspace: true
tailscale_tags:
  - tag:funnel

tailscale_serve:
  - port: 443
    protocol: https
    target: "http://127.0.0.1:8080"
    mount: "/"
    funnel: true

lxc_compose_apps:
  - dest: "/opt/example-stack"
    owner: "root"
    group: "root"
    compose: true
    compose_file_name: "compose.yaml"
    compose_file_content: |
      services:
        web:
          image: nginx:alpine
          restart: unless-stopped
          ports:
            - "8080:80"
