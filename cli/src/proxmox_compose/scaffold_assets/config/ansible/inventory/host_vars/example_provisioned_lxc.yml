# Example: host metadata for an Ansible-managed Debian LXC.
# Rename this file to match your inventory hostname.

# Inventory sync can infer groups from these keys:
proxmox_compose_host_kind: lxc
proxmox_compose_host_os: debian
# Optional explicit override:
# proxmox_compose_inventory_group: debian_lxcs

# Host connection defaults consumed in hosts.yml generation.
ansible_host: 10.0.0.50
ansible_user: root

# Metadata used by role lxc_host_config.
lxc_host_config_enable: true
lxc_host_config_vmid: 210
lxc_host_config_node_name: pve
lxc_host_config_node_addresses:
  pve: 10.0.0.2
lxc_host_config_ssh_user: root

# Optional: kernel TUN for tailscaled inside an unprivileged LXC.
# lxc_tun_enable: true
#
# Optional: Tailscale daemon on the LXC (auth key should come from vault).
# tailscale_enable: true
# tailscale_hostname: my-lxc
#
# Optional: Caddy reverse proxy for HTTPS/tailnet entrypoint to an upstream.
# lxc_caddy_proxy_enable: true
# lxc_caddy_proxy_server_name: app.example.ts.net
# lxc_caddy_proxy_upstream: 10.0.0.2:8006
# lxc_caddy_proxy_upstream_tls: true
# lxc_caddy_proxy_upstream_tls_insecure_skip_verify: false
