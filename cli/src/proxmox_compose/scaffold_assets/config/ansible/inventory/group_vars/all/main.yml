ansible_python_interpreter: /usr/bin/python3

# Declarative SSH public keys (see docs/mobile-ssh.md). Override ssh_authorized_keys in host_vars to replace the merged list.
ssh_authorized_keys_user: root
ssh_authorized_keys_base:
  - "{{ proxmox_compose_lxc_pubkey | default('') }}"
ssh_authorized_keys_extra: []
ssh_authorized_keys: >-
  {{
    (
      (ssh_authorized_keys_base | default([]))
      + (ssh_authorized_keys_extra | default([]))
      + (ssh_authorized_keys_vault | default([]))
    )
    | select('string')
    | map('trim')
    | reject('equalto', '')
    | unique
    | list
  }}

vm_compose_apps: []

lxc_compose_apps: []
lxc_docker_enable: false

lxc_systemd_services: []

# Build Go modules for lxc_git_apps on the Ansible controller (requires `go` there); set false to build on the LXC.
lxc_go_build_local: true

tailscale_enable: false
tailscale_serve: []

# Optional lifecycle declarations consumed by role proxmox_lifecycle.
# Keep concrete host metadata in host_vars and reference it here.
# Safety guard for destructive lifecycle state=absent operations.
proxmox_lifecycle_allow_absent: false

# Opt-in: patch /etc/pve/lxc/<vmid>.conf on the Proxmox node over SSH from the Ansible controller.
# See role lxc_host_config and docs/lxc-docker-compose.md.
lxc_host_config_enable: false
lxc_host_config_restart: false
lxc_apparmor_unconfined_enable: false
lxc_apparmor_ubuntu_mask_enable: false
lxc_tun_enable: false
lxc_host_config_node_addresses: {}
