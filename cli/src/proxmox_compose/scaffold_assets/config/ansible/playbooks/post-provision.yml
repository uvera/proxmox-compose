- name: Proxmox host-side CT config for Debian LXCs (optional)
  hosts: debian_lxcs
  gather_facts: false
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - role: lxc_host_config

- name: Configure provisioned VMs and LXCs
  hosts: debian_vms:fedora_vms:debian_lxcs
  gather_facts: false
  become: true
  pre_tasks:
    - name: Wait for SSH connectivity after host-side CT changes
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

    - name: Clear stale facts from prior local-connection play
      ansible.builtin.meta: clear_facts

    - name: Gather target host facts over SSH
      ansible.builtin.setup:
  roles:
    - role: common

- name: Configure Tailscale on VMs and LXCs
  hosts: debian_vms:fedora_vms:debian_lxcs
  become: true
  ignore_unreachable: true
  roles:
    - role: tailscale

- name: Configure Caddy reverse proxy on Debian LXCs
  hosts: debian_lxcs
  become: true
  ignore_unreachable: true
  roles:
    - role: lxc_caddy_proxy

- name: Configure CUPS print server on Debian LXCs
  hosts: debian_lxcs
  become: true
  ignore_unreachable: true
  roles:
    - role: lxc_cups

- name: Configure Docker workloads on VMs
  hosts: debian_vms:fedora_vms
  become: true
  ignore_unreachable: true
  roles:
    - role: vm_docker

- name: Configure Docker Compose workloads on Debian LXCs
  hosts: debian_lxcs
  become: true
  ignore_unreachable: true
  roles:
    - role: lxc_docker

- name: Configure systemd services on Debian LXCs
  hosts: debian_lxcs
  become: true
  ignore_unreachable: true
  roles:
    - role: lxc_systemd_service
