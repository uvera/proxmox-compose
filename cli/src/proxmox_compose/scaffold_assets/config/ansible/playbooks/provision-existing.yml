- name: Proxmox host-side CT config for Debian LXCs (optional)
  hosts: debian_lxcs:existing_hosts
  gather_facts: false
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - role: lxc_host_config

- name: Converge existing infrastructure
  hosts: existing_hosts
  become: true
  ignore_unreachable: true
  roles:
    - role: common
    - role: tailscale
    - role: existing_maintenance

- name: Converge Docker workloads on existing VMs
  hosts: existing_docker_vms
  become: true
  ignore_unreachable: true
  roles:
    - role: vm_docker

- name: Configure CUPS print server on Debian LXCs
  hosts: debian_lxcs
  become: true
  ignore_unreachable: true
  roles:
    - role: lxc_cups
