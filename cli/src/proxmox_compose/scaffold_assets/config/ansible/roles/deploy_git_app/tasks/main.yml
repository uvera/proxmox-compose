- name: Collect explicitly requested groups for deploy_git_app
  ansible.builtin.set_fact:
    _deploy_git_app_declared_groups: >-
      {{
        (
          deploy_git_apps
          | default([])
          | map(attribute='group')
          | select('defined')
          | list
        )
        +
        (
          deploy_git_apps
          | default([])
          | map(attribute='managed_files')
          | select('defined')
          | flatten
          | map(attribute='group')
          | select('defined')
          | list
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Ensure declared groups exist for app stacks
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
    system: "{{ deploy_git_app_ensure_groups_system | bool }}"
  loop: "{{ _deploy_git_app_declared_groups | default([]) }}"
  when: deploy_git_app_ensure_groups | bool
  loop_control:
    label: "{{ item }}"

- name: Ensure app directories exist
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default(omit) }}"
    mode: "0755"
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Ensure managed file parent directories exist
  ansible.builtin.file:
    path: "{{ item.1.dest | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ deploy_git_apps | default([]) | subelements('managed_files', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.dest | dirname }} ← {{ item.1.dest }}"

- name: Collect repository destinations for safe.directory
  ansible.builtin.set_fact:
    _deploy_git_app_repo_destinations: >-
      {{
        deploy_git_apps
        | default([])
        | selectattr('repo', 'defined')
        | map(attribute='dest')
        | select('defined')
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Read globally configured safe.directory paths
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - --get-all
      - safe.directory
  register: _deploy_git_app_safe_directories
  changed_when: false
  failed_when: false

- name: Ensure repository destinations are trusted by git
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - --add
      - safe.directory
      - "{{ item }}"
  when: item not in (_deploy_git_app_safe_directories.stdout_lines | default([]))
  loop: "{{ _deploy_git_app_repo_destinations | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Checkout repositories
  ansible.builtin.git:
    repo: "{{ _deploy_git_app_resolved_repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.version | default('main') }}"
    key_file: "{{ item.key_file | default(omit) if not _deploy_git_app_https_token_auth else omit }}"
    accept_hostkey: true
    depth: "{{ item.git_clone_depth | default(deploy_git_app_git_clone_depth | default(1)) }}"
    single_branch: "{{ item.git_single_branch | default(true) }}"
    force: "{{ item.git_force | default(deploy_git_app_git_force | default(false)) }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
  vars:
    _deploy_git_app_token: >-
      {{
        item.git_token
        | default(deploy_git_app_git_token | default('', true), true)
        | default(lookup('env', deploy_git_app_git_token_env_var, default=''), true)
        | trim
      }}
    _deploy_git_app_token_user: >-
      {{
        item.git_token_username
        | default(deploy_git_app_git_token_username, true)
        | default('x-access-token', true)
      }}
    _deploy_git_app_https_token_auth: >-
      {{
        _deploy_git_app_token | length > 0
        and item.repo is match('^https?://')
      }}
    _deploy_git_app_resolved_repo: >-
      {{
        (
          item.repo | regex_replace(
            '^(https?://)',
            '\1' ~ (_deploy_git_app_token_user | urlencode) ~ ':' ~ (_deploy_git_app_token | urlencode) ~ '@'
          )
        ) if _deploy_git_app_https_token_auth else item.repo
      }}
  no_log: "{{ _deploy_git_app_https_token_auth | bool }}"
  when: item.repo is defined
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Write inline compose files when provided
  ansible.builtin.copy:
    dest: "{{ item.dest }}/{{ item.compose_file_name | default('docker-compose.yaml') }}"
    content: "{{ item.compose_file_content }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.compose_file_mode | default('0644') }}"
  when: item.compose_file_content is defined
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Write env files when provided
  ansible.builtin.copy:
    dest: "{{ item.dest }}/{{ item.env_file_name | default('.env') }}"
    content: "{{ item.env_content }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.env_file_mode | default('0600') }}"
  no_log: true
  when: item.env_content is defined
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Write managed files for app stacks
  ansible.builtin.assert:
    that:
      - item.1.content is defined or item.1.src is defined
    quiet: true
    fail_msg: >-
      managed_files entry for {{ item.1.dest }} must define either `content` or `src`.
  loop: "{{ deploy_git_apps | default([]) | subelements('managed_files', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.dest }}"
  no_log: "{{ item.1.secret | default(false) }}"

- name: Write managed files for app stacks (inline content)
  ansible.builtin.copy:
    dest: "{{ item.1.dest }}"
    content: "{{ item.1.content }}"
    owner: "{{ item.1.owner | default(item.0.owner | default('root')) }}"
    group: "{{ item.1.group | default(item.0.group | default(omit)) }}"
    mode: "{{ item.1.mode | default('0644') }}"
  when: item.1.content is defined
  loop: "{{ deploy_git_apps | default([]) | subelements('managed_files', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.dest }}"
  no_log: "{{ item.1.secret | default(false) }}"
  register: _deploy_git_app_managed_file_content_writes

- name: Write managed files for app stacks (controller source file)
  ansible.builtin.copy:
    dest: "{{ item.1.dest }}"
    src: "{{ item.1.src }}"
    owner: "{{ item.1.owner | default(item.0.owner | default('root')) }}"
    group: "{{ item.1.group | default(item.0.group | default(omit)) }}"
    mode: "{{ item.1.mode | default('0644') }}"
  when: item.1.src is defined
  loop: "{{ deploy_git_apps | default([]) | subelements('managed_files', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.dest }}"
  no_log: "{{ item.1.secret | default(false) }}"
  register: _deploy_git_app_managed_file_src_writes

- name: Merge managed file write results
  ansible.builtin.set_fact:
    _deploy_git_app_managed_file_writes:
      results: >-
        {{
          (_deploy_git_app_managed_file_content_writes.results | default([]))
          + (_deploy_git_app_managed_file_src_writes.results | default([]))
        }}

- name: Check Docker Compose v2 CLI availability
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - version
  register: _deploy_git_app_compose_v2_check
  changed_when: false
  failed_when: false
  when:
    - deploy_git_app_enable_compose | bool
    - not (deploy_git_app_skip_compose | default(false) | bool)

- name: Check Docker Compose v1 CLI availability
  ansible.builtin.command:
    argv:
      - docker-compose
      - version
  register: _deploy_git_app_compose_v1_check
  changed_when: false
  failed_when: false
  when:
    - deploy_git_app_enable_compose | bool
    - not (deploy_git_app_skip_compose | default(false) | bool)

- name: Resolve Docker Compose CLI mode
  ansible.builtin.set_fact:
    _deploy_git_app_compose_mode: "{{ 'v2' if (_deploy_git_app_compose_v2_check.rc | default(1)) == 0 else ('v1' if (_deploy_git_app_compose_v1_check.rc | default(1)) == 0 else '') }}"
    _deploy_git_app_compose_argv: "{{ ['docker', 'compose'] if (_deploy_git_app_compose_v2_check.rc | default(1)) == 0 else (['docker-compose'] if (_deploy_git_app_compose_v1_check.rc | default(1)) == 0 else []) }}"
  when:
    - deploy_git_app_enable_compose | bool
    - not (deploy_git_app_skip_compose | default(false) | bool)

- name: Require Docker Compose CLI when compose deployment is enabled
  ansible.builtin.assert:
    that:
      - (_deploy_git_app_compose_mode | default('') | length) > 0
    fail_msg: >-
      Docker Compose CLI not found. Install docker compose plugin (v2) or docker-compose (v1).
  when:
    - deploy_git_app_enable_compose | bool
    - not (deploy_git_app_skip_compose | default(false) | bool)

- name: Ensure skopeo is installed for skopeo prepull
  ansible.builtin.package:
    name: "{{ deploy_git_app_skopeo_package_name }}"
    state: present
  when:
    - deploy_git_app_prepull | default(false) | bool
    - (deploy_git_app_prepull_method | default('docker') | lower) == 'skopeo'

- name: Pre-pull images for app stacks
  ansible.builtin.include_tasks: prepull.yml
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  vars:
    deploy_git_app_item: "{{ item }}"
  when: deploy_git_app_prepull | default(false) | bool

- name: Deploy compose stacks with Docker Compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ item.dest }}"
    files: "{{ [item.compose_file_name] if item.compose_file_name is defined else omit }}"
    state: present
  when:
    - deploy_git_app_enable_compose | bool
    - not (deploy_git_app_skip_compose | default(false) | bool)
    - (_deploy_git_app_compose_mode | default('')) == 'v2'
    - item.compose | default(true)
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Deploy compose stacks with Docker Compose v1
  ansible.builtin.command:
    argv: "{{ _deploy_git_app_compose_argv + ['-f', (item.compose_file_name | default('docker-compose.yaml')), 'up', '-d'] }}"
  args:
    chdir: "{{ item.dest }}"
  register: _deploy_git_app_compose_v1_up
  changed_when: >-
    (
      (_deploy_git_app_compose_v1_up.stdout | default(''))
      ~
      (_deploy_git_app_compose_v1_up.stderr | default(''))
    ) is regex('Creating|Recreating|Starting|Pulling|Building|Downloading', ignorecase=False)
  failed_when: (_deploy_git_app_compose_v1_up.rc | default(1)) != 0
  when:
    - deploy_git_app_enable_compose | bool
    - not (deploy_git_app_skip_compose | default(false) | bool)
    - (_deploy_git_app_compose_mode | default('')) == 'v1'
    - item.compose | default(true)
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Restart compose services when managed files require restart
  ansible.builtin.command:
    argv: >-
      {{
        _deploy_git_app_compose_argv
        + ['-f', (item.item.0.compose_file_name | default('docker-compose.yaml')), 'restart']
        + (item.item.1.compose_services | default([]))
      }}
  args:
    chdir: "{{ item.item.0.dest }}"
  loop: "{{ _deploy_git_app_managed_file_writes.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.dest }} :: {{ item.item.1.dest }}"
  when:
    - deploy_git_app_enable_compose | bool
    - not (deploy_git_app_skip_compose | default(false) | bool)
    - item.item.0.compose | default(true)
    - item.changed | bool
    - item.item.1.restart_compose | default(false) | bool
