- name: Collect explicitly requested groups for deploy_git_app
  ansible.builtin.set_fact:
    _deploy_git_app_declared_groups: >-
      {{
        (
          deploy_git_apps
          | default([])
          | map(attribute='group')
          | select('defined')
          | list
        )
        +
        (
          deploy_git_apps
          | default([])
          | map(attribute='managed_files')
          | select('defined')
          | flatten
          | map(attribute='group')
          | select('defined')
          | list
        )
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Ensure declared groups exist for app stacks
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
    system: "{{ deploy_git_app_ensure_groups_system | bool }}"
  loop: "{{ _deploy_git_app_declared_groups | default([]) }}"
  when: deploy_git_app_ensure_groups | bool
  loop_control:
    label: "{{ item }}"

- name: Ensure app directories exist
  ansible.builtin.file:
    path: "{{ item.dest }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default(omit) }}"
    mode: "0755"
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Ensure managed file parent directories exist
  ansible.builtin.file:
    path: "{{ item.1.dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ deploy_git_apps | default([]) | subelements('managed_files', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.dest | dirname }} ← {{ item.1.dest }}"

- name: Collect repository destinations for safe.directory
  ansible.builtin.set_fact:
    _deploy_git_app_repo_destinations: >-
      {{
        deploy_git_apps
        | default([])
        | selectattr('repo', 'defined')
        | map(attribute='dest')
        | select('defined')
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Read globally configured safe.directory paths
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - --get-all
      - safe.directory
  register: _deploy_git_app_safe_directories
  changed_when: false
  failed_when: false

- name: Ensure repository destinations are trusted by git
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - --add
      - safe.directory
      - "{{ item }}"
  when: item not in (_deploy_git_app_safe_directories.stdout_lines | default([]))
  loop: "{{ _deploy_git_app_repo_destinations | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Checkout repositories
  ansible.builtin.git:
    repo: "{{ _deploy_git_app_resolved_repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.version | default('main') }}"
    key_file: "{{ item.key_file | default(omit) if not _deploy_git_app_https_token_auth else omit }}"
    accept_hostkey: true
    depth: "{{ item.git_clone_depth | default(deploy_git_app_git_clone_depth | default(1)) }}"
    single_branch: "{{ item.git_single_branch | default(true) }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
  vars:
    _deploy_git_app_token: >-
      {{
        item.git_token
        | default(deploy_git_app_git_token | default('', true), true)
        | default(lookup('env', deploy_git_app_git_token_env_var, default=''), true)
        | trim
      }}
    _deploy_git_app_token_user: >-
      {{
        item.git_token_username
        | default(deploy_git_app_git_token_username, true)
        | default('x-access-token', true)
      }}
    _deploy_git_app_https_token_auth: >-
      {{
        _deploy_git_app_token | length > 0
        and item.repo is match('^https?://')
      }}
    _deploy_git_app_resolved_repo: >-
      {{
        (
          item.repo | regex_replace(
            '^(https?://)',
            '\1' ~ (_deploy_git_app_token_user | urlencode) ~ ':' ~ (_deploy_git_app_token | urlencode) ~ '@'
          )
        ) if _deploy_git_app_https_token_auth else item.repo
      }}
  no_log: "{{ _deploy_git_app_https_token_auth | bool }}"
  when: item.repo is defined
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Write inline compose files when provided
  ansible.builtin.copy:
    dest: "{{ item.dest }}/{{ item.compose_file_name | default('docker-compose.yaml') }}"
    content: "{{ item.compose_file_content }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.compose_file_mode | default('0644') }}"
  when: item.compose_file_content is defined
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Write env files when provided
  ansible.builtin.copy:
    dest: "{{ item.dest }}/{{ item.env_file_name | default('.env') }}"
    content: "{{ item.env_content }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.env_file_mode | default('0600') }}"
  no_log: true
  when: item.env_content is defined
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Write managed files for app stacks
  ansible.builtin.copy:
    dest: "{{ item.1.dest }}"
    content: "{{ item.1.content }}"
    owner: "{{ item.1.owner | default(item.0.owner | default('root')) }}"
    group: "{{ item.1.group | default(item.0.group | default(omit)) }}"
    mode: "{{ item.1.mode | default('0644') }}"
  loop: "{{ deploy_git_apps | default([]) | subelements('managed_files', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.dest }}"
  no_log: "{{ item.1.secret | default(false) }}"

- name: Deploy compose stacks
  community.docker.docker_compose_v2:
    project_src: "{{ item.dest }}"
    files: "{{ [item.compose_file_name] if item.compose_file_name is defined else omit }}"
    state: present
  when:
    - deploy_git_app_enable_compose | bool
    - item.compose | default(true)
  loop: "{{ deploy_git_apps | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
