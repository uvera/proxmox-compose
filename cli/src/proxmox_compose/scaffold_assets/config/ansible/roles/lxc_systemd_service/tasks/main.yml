- name: Install Debian packages for LXC services
  ansible.builtin.apt:
    update_cache: true
    name: "{{ lxc_packages }}"
    state: present

- name: Deploy app repositories for service workloads
  ansible.builtin.include_role:
    name: deploy_git_app
  vars:
    deploy_git_apps: "{{ lxc_git_apps }}"
    deploy_git_app_enable_compose: false

- name: Assert supported architecture for Go builds
  ansible.builtin.assert:
    that:
      - ansible_architecture in ["x86_64", "aarch64"]
    fail_msg: "Unsupported architecture for Go build workflow: {{ ansible_architecture }}"
  when: lxc_git_apps | selectattr('go_install_path', 'defined') | list | length > 0

- name: Ensure go build revision stamp directory exists
  ansible.builtin.file:
    path: /var/lib/ansible-go-revs
    state: directory
    mode: "0755"
  when:
    - not (lxc_go_build_local | bool)
    - lxc_git_apps | selectattr('go_install_path', 'defined') | list | length > 0

- name: Ensure requested Go toolchain version is installed
  ansible.builtin.shell: |
    set -euo pipefail
    version="{{ item.go_version }}"
    case "{{ ansible_architecture }}" in
      x86_64) go_arch="amd64" ;;
      aarch64) go_arch="arm64" ;;
      *)
        echo "Unsupported architecture for Go toolchain bootstrap: {{ ansible_architecture }}" >&2
        exit 1
        ;;
    esac
    current="$(/usr/local/go/bin/go version 2>/dev/null | awk '{print $3}' || true)"
    if [ "$current" = "go${version}" ]; then
      echo "unchanged"
      exit 0
    fi
    url="https://go.dev/dl/go${version}.linux-${go_arch}.tar.gz"
    tarball="/tmp/go${version}.linux-${go_arch}.tar.gz"
    export GO_URL="$url"
    export GO_TARBALL="$tarball"
    python3 - <<'PY'
    import os
    import urllib.request
    urllib.request.urlretrieve(os.environ["GO_URL"], os.environ["GO_TARBALL"])
    PY
    rm -rf /usr/local/go
    tar -C /usr/local -xzf "$tarball"
    ln -sf /usr/local/go/bin/go /usr/local/bin/go
    ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
    rm -f "$tarball"
    echo "installed"
  args:
    executable: /bin/bash
  loop: "{{ lxc_git_apps }}"
  when:
    - not (lxc_go_build_local | bool)
    - item.go_version is defined
    - item.go_version | length > 0
  register: lxc_go_toolchain_results
  changed_when: >
    not (lxc_go_toolchain_results.skipped | default(false))
    and (
      'installed' in (lxc_go_toolchain_results.results | default([])
        | selectattr('stdout', 'defined')
        | map(attribute='stdout')
        | join(''))
      or 'installed' in (lxc_go_toolchain_results.stdout | default(''))
    )

- name: Go build install for LXC git apps
  ansible.builtin.shell: |
    set -e
    cd "{{ item.dest }}"
    head=$(git rev-parse HEAD)
    stamp="/var/lib/ansible-go-revs/{{ item.go_install_path | regex_replace('^/', '') | replace('/', '_') }}.rev"
    if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$head" ] && [ -f "{{ item.go_install_path }}" ]; then
      echo "unchanged"
      exit 0
    fi
    GO_BIN="$(command -v go || true)"
    if [ -x /usr/local/go/bin/go ]; then
      GO_BIN="/usr/local/go/bin/go"
    fi
    if [ -z "$GO_BIN" ]; then
      echo "go binary not found in PATH and /usr/local/go/bin/go is missing" >&2
      exit 1
    fi
    "$GO_BIN" build {{ (item.go_build_args | default([])) | map('quote') | join(' ') }} -o "{{ item.go_install_path }}" .
    printf '%s' "$head" > "$stamp"
    echo "rebuilt"
  args:
    executable: /bin/bash
  loop: "{{ lxc_git_apps }}"
  environment: "{{ item.go_build_environment | default({}) }}"
  when:
    - not (lxc_go_build_local | bool)
    - item.repo is defined
    - item.go_install_path is defined
  register: lxc_go_build_results
  changed_when: >
    not (lxc_go_build_results.skipped | default(false))
    and (
      'rebuilt' in (lxc_go_build_results.results | default([])
        | selectattr('stdout', 'defined')
        | map(attribute='stdout')
        | join(''))
      or 'rebuilt' in (lxc_go_build_results.stdout | default(''))
    )
  notify: Restart LXC services

- name: Ensure local Go binary is available
  ansible.builtin.command: go version
  delegate_to: localhost
  become: false
  changed_when: false
  when:
    - lxc_go_build_local | bool
    - lxc_git_apps | selectattr('go_install_path', 'defined') | list | length > 0

- name: Ensure local Go build cache directories exist
  ansible.builtin.file:
    path: "{{ lxc_go_local_build_cache_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  loop:
    - src
    - bin
  when:
    - lxc_go_build_local | bool
    - lxc_git_apps | selectattr('go_install_path', 'defined') | list | length > 0

- name: Read git revision for local Go builds
  ansible.builtin.command: git -C "{{ item.dest }}" rev-parse HEAD
  loop: "{{ lxc_git_apps }}"
  when:
    - lxc_go_build_local | bool
    - item.repo is defined
    - item.go_install_path is defined
  register: lxc_go_git_head_results
  changed_when: false

- name: Sync local source checkouts for Go builds
  ansible.builtin.git:
    repo: "{{ item.item.repo }}"
    dest: "{{ lxc_go_local_build_cache_dir }}/src/{{ inventory_hostname }}-{{ item.item.go_install_path | regex_replace('^/', '') | replace('/', '_') }}"
    version: "{{ item.stdout }}"
    key_file: "{{ item.item.key_file | default(omit) }}"
    accept_hostkey: true
    force: true
  delegate_to: localhost
  become: false
  loop: "{{ lxc_go_git_head_results.results | default([]) }}"
  when:
    - lxc_go_build_local | bool
    - not (item.skipped | default(false))

- name: Build Go binaries locally for LXC git apps
  ansible.builtin.command: >-
    go build {{ (item.item.go_build_args | default([])) | map('quote') | join(' ') }}
    -o "{{ local_binary_path }}" .
  args:
    chdir: "{{ lxc_go_local_build_cache_dir }}/src/{{ inventory_hostname }}-{{ item.item.go_install_path | regex_replace('^/', '') | replace('/', '_') }}"
    creates: "{{ local_binary_path }}"
  environment: >-
    {{
      (item.item.go_build_environment | default({}))
      | combine({
        'GOOS': 'linux',
        'GOARCH': ('amd64' if ansible_architecture == 'x86_64' else 'arm64'),
        'CGO_ENABLED': lxc_go_local_cgo_enabled
      })
    }}
  vars:
    local_build_signature: >-
      {{
        (
          ((item.item.go_build_args | default([])) | join(' '))
          ~ '|'
          ~ ((item.item.go_build_environment | default({})) | to_json)
          ~ '|'
          ~ (lxc_go_local_cgo_enabled | string)
        ) | hash('sha1')
      }}
    local_binary_path: "{{ lxc_go_local_build_cache_dir }}/bin/{{ inventory_hostname }}-{{ item.item.go_install_path | regex_replace('^/', '') | replace('/', '_') }}-{{ item.stdout }}-{{ local_build_signature }}"
  delegate_to: localhost
  become: false
  loop: "{{ lxc_go_git_head_results.results | default([]) }}"
  when:
    - lxc_go_build_local | bool
    - not (item.skipped | default(false))

- name: Install locally built Go binaries on LXC
  ansible.builtin.copy:
    src: "{{ local_binary_path }}"
    dest: "{{ item.item.go_install_path }}"
    owner: "{{ item.item.owner | default('root') }}"
    group: "{{ item.item.group | default('root') }}"
    mode: "{{ item.item.go_install_mode | default('0755') }}"
  vars:
    local_build_signature: >-
      {{
        (
          ((item.item.go_build_args | default([])) | join(' '))
          ~ '|'
          ~ ((item.item.go_build_environment | default({})) | to_json)
          ~ '|'
          ~ (lxc_go_local_cgo_enabled | string)
        ) | hash('sha1')
      }}
    local_binary_path: "{{ lxc_go_local_build_cache_dir }}/bin/{{ inventory_hostname }}-{{ item.item.go_install_path | regex_replace('^/', '') | replace('/', '_') }}-{{ item.stdout }}-{{ local_build_signature }}"
  loop: "{{ lxc_go_git_head_results.results | default([]) }}"
  when:
    - lxc_go_build_local | bool
    - not (item.skipped | default(false))
  notify: Restart LXC services

- name: Ensure Python app runtime users exist
  ansible.builtin.group:
    name: "{{ item.group | default(item.user) }}"
    state: present
  loop: "{{ lxc_python_apps }}"
  when:
    - item.user is defined
    - item.user != "root"

- name: Ensure Python app runtime users exist
  ansible.builtin.user:
    name: "{{ item.user }}"
    group: "{{ item.group | default(item.user) }}"
    create_home: "{{ item.create_home | default(true) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
  loop: "{{ lxc_python_apps }}"
  when:
    - item.user is defined
    - item.user != "root"

- name: Ensure Python app directories are owned by runtime users
  ansible.builtin.file:
    path: "{{ item.app_dir }}"
    state: directory
    owner: "{{ item.user | default('root') }}"
    group: "{{ item.group | default(item.user | default('root')) }}"
    mode: "0755"
    recurse: true
  loop: "{{ lxc_python_apps }}"

- name: Ensure Python virtual environments exist
  ansible.builtin.command:
    argv:
      - "{{ item.python_bin | default('python3') }}"
      - -m
      - venv
      - "{{ item.venv_dir | default(item.app_dir ~ '/.venv') }}"
    creates: "{{ item.venv_dir | default(item.app_dir ~ '/.venv') }}/bin/python"
  loop: "{{ lxc_python_apps }}"
  become: true
  become_user: "{{ item.user | default('root') }}"
  become_method: "{{ lxc_python_become_method }}"

- name: Upgrade pip in Python virtual environments
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ item.venv_dir | default(item.app_dir ~ '/.venv') }}"
    virtualenv_python: "{{ item.python_bin | default('python3') }}"
  loop: "{{ lxc_python_apps }}"
  become: true
  become_user: "{{ item.user | default('root') }}"
  become_method: "{{ lxc_python_become_method }}"

- name: Install Python applications in editable mode
  ansible.builtin.pip:
    name: "{{ item.app_dir }}"
    editable: true
    state: present
    virtualenv: "{{ item.venv_dir | default(item.app_dir ~ '/.venv') }}"
    virtualenv_python: "{{ item.python_bin | default('python3') }}"
  loop: "{{ lxc_python_apps }}"
  become: true
  become_user: "{{ item.user | default('root') }}"
  become_method: "{{ lxc_python_become_method }}"
  notify: Restart LXC services

- name: Run Python app migrations
  ansible.builtin.shell: |
    set -euo pipefail
    set -a
    source "{{ item.environment_file }}"
    set +a
    "{{ item.venv_dir | default(item.app_dir ~ '/.venv') }}/bin/alembic" upgrade head
  args:
    executable: /bin/bash
    chdir: "{{ item.app_dir }}"
  loop: "{{ lxc_python_apps }}"
  become: true
  become_user: "{{ item.user | default('root') }}"
  become_method: "{{ lxc_python_become_method }}"
  when:
    - item.migrate | default(false)
    - item.environment_file is defined
  changed_when: false

- name: Install systemd unit files
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    mode: "0644"
  loop: "{{ lxc_systemd_services }}"
  notify: Restart LXC services

- name: Enable and start services
  ansible.builtin.service:
    name: "{{ item.name }}"
    enabled: true
    state: started
  loop: "{{ lxc_systemd_services }}"
