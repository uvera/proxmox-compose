---
# Declarative lifecycle definitions consumed by role proxmox_lifecycle.
# Each entry should provide `module_args` passed to the underlying Proxmox module.
proxmox_lifecycle_vms: []
proxmox_lifecycle_lxcs: []

# Safety guard: only allow delete actions when explicitly enabled.
proxmox_lifecycle_allow_absent: false

# Auth defaults from profile env.
proxmox_lifecycle_api_host: "{{ lookup('env', 'PROXMOX_ENDPOINT') }}"
proxmox_lifecycle_api_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
proxmox_lifecycle_api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
proxmox_lifecycle_validate_certs: "{{ (lookup('env', 'PROXMOX_INSECURE') | default('false', true) | lower) not in ['1', 'true', 'yes'] }}"
