name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  iac-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI test dependencies
        run: pip install pytest typer PyYAML textual ansible-core
      - name: Run CLI tests
        run: PYTHONPATH=cli/src python -m pytest cli/tests -q
      - name: Ansible syntax check (provision-infra)
        run: |
          cd cli/src/proxmox_compose/scaffold_assets/config/ansible
          ansible-playbook -i inventory/static.yml playbooks/provision-infra.yml --syntax-check
      - name: Ansible syntax check (post-provision)
        run: |
          cd cli/src/proxmox_compose/scaffold_assets/config/ansible
          ansible-playbook -i inventory/static.yml playbooks/post-provision.yml --syntax-check
